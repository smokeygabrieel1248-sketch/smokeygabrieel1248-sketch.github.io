<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="monetag" content="1463de3edfca9895d9816c88d5361b68">
<title>DALE AL CASTOR</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #2b1d12; color: #fff6e5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; user-select: none;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 1.7rem; margin: 0 0 12px; }
  .bar { display: flex; justify-content: space-between; font-size: 1.4rem; font-weight: 700; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .hole {
    aspect-ratio: 1; background: #5a3a1e; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.2rem; border: 0; padding: 0; color: inherit;
    box-shadow: inset 0 -10px 0 #3e2712;
  }
  .hole span { transform: scale(0); transition: transform .12s; }
  .hole.up span { transform: scale(1); }
  .hole.hit { background: #8a5a2b; }
  button.main {
    margin-top: 20px; background: #ffc233; color: #1a1a1a; border: 0;
    font-size: 1.3rem; font-weight: 800; padding: 16px 40px; border-radius: 14px;
  }
  #msg { min-height: 1.6em; margin-top: 14px; font-size: 1.1rem; color: #ffd98a; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>🦫 DALE AL CASTOR 🦫</h1>
  <div class="bar"><div>⏱️ <span id="time">30</span>s</div><div>🔨 <span id="score">0</span></div></div>
  <div class="grid" id="grid"></div>
  <div id="msg">¡Dale a los castores más rápido!</div>
  <button class="main" id="start">¡EMPEZAR!</button>
</main>

<!-- AQUÍ IRÁ EL CÓDIGO DE LA ZONA ONCLICK DE MONETAG -->

<script>
(function () {
  var grid = document.getElementById('grid');
  var timeEl = document.getElementById('time');
  var scoreEl = document.getElementById('score');
  var msg = document.getElementById('msg');
  var startBtn = document.getElementById('start');
  var holes = [], score = 0, time = 30, running = false, current = -1;
  var timerId = null, popId = null, best = 0;
  try { best = parseInt(localStorage.getItem('castorBest') || '0', 10) || 0; } catch (e) {}

  for (var i = 0; i < 9; i++) {
    var b = document.createElement('button');
    b.className = 'hole'; b.setAttribute('aria-label', 'Hoyo ' + (i + 1));
    b.innerHTML = '<span>🦫</span>';
    (function (idx) {
      b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); hit(idx); });
    })(i);
    grid.appendChild(b); holes.push(b);
  }

  function hide() { if (current >= 0) holes[current].classList.remove('up'); current = -1; }
  function pop() {
    hide();
    var n; do { n = Math.floor(Math.random() * 9); } while (n === current);
    current = n; holes[n].classList.add('up');
    var wait = Math.max(420, 900 - score * 12);
    popId = setTimeout(pop, wait);
  }
  function hit(idx) {
    if (!running || idx !== current) return;
    score++; scoreEl.textContent = score;
    holes[idx].classList.add('hit');
    setTimeout(function () { holes[idx].classList.remove('hit'); }, 120);
    clearTimeout(popId); pop();
  }
  function end() {
    running = false; clearInterval(timerId); clearTimeout(popId); hide();
    if (score > best) { best = score; try { localStorage.setItem('castorBest', String(best)); } catch (e) {} }
    msg.textContent = 'Fin: ' + score + ' castores. Récord: ' + best;
    startBtn.style.display = ''; startBtn.textContent = 'JUGAR OTRA VEZ';
  }
  startBtn.addEventListener('click', function () {
    score = 0; time = 30; scoreEl.textContent = 0; timeEl.textContent = 30;
    msg.textContent = '¡Dale!'; startBtn.style.display = 'none'; running = true;
    pop();
    timerId = setInterval(function () {
      time--; timeEl.textContent = time;
      if (time <= 0) end();
    }, 1000);
  });
})();
</script>
</body>
</html>
